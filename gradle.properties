# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the
# command line, check that file is checked in or updated so that it reflects
# the actual build behavior.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for headless machines. See also
# http://www.gradle.org/docs/current/userguide/java_9_support_for_gradle
# org.gradle.jvmargs=-Xmx1024m -XX:MaxPermSize=256m
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. See also
# http://www.gradle.org/docs/current/userguide/multi_project_builds/#decoupled_projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are being used
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and does not include a namespace prefix.
android.nonTransitiveRClass=true
